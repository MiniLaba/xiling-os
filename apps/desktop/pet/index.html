<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>汐灵指示球</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
      }
      #stage {
        width: 100%;
        height: 100%;
        cursor: grab;
      }
      #stage.dragging {
        cursor: grabbing;
      }
    </style>
  </head>

    <div id="stage"></div>
    <script type="module" src="./dist/pet.js"></script>
  </body>
</html>
