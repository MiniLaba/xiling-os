name: cross-platform
on:
  push:
  pull_request:
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.19.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22.19.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @xiling/web build
      - run: node scripts/platform-smoke.mjs
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem scripts/windows/*.ps1 | ForEach-Object {
            [void][scriptblock]::Create((Get-Content -LiteralPath $_.FullName -Raw))
          }
      - if: runner.os == 'Linux'
        run: pnpm compliance && pnpm sbom:generate
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with: { name: spdx-sbom, path: build/sbom.spdx.json }
  # 真实渲染冒烟：构建产物在无头 Chromium 中启动，断言应用不进入错误边界。
  # 这道防线拦截「合并后所有人都打不开」级别的回归（如 Provider 崩溃、样式缺失）。
  ui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.19.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22.19.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @xiling/web build
      - run: pnpm add -w playwright@1.55.0
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/ui-dom-smoke.mjs
  runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: services/runner, load: true, tags: xiling-runner:gate4 }
      - run: docker run --rm --network none xiling-runner:gate4 python connector_smoke.py
