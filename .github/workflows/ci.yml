name: cross-platform
on:
  push:
  pull_request:
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.19.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22.19.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - if: runner.os == 'Linux'
        run: pnpm compliance && pnpm sbom:generate
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with: { name: spdx-sbom, path: build/sbom.spdx.json }
  # 真实桌面冒烟：在虚拟显示器中启动 Electron，并等待 Renderer 与 Core 同时就绪。
  ui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.19.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22.19.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: xvfb-run --auto-servernum env XILING_DESKTOP_LAUNCH_SMOKE=1 pnpm start
